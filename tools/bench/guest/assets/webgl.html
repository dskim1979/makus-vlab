<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MOAVI bench - 3D rotate</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242c; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #fps { position: fixed; left: 12px; top: 8px; color: #9ab; font: 14px monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<script>
// A lit torus knot of about 200k triangles turning at a fixed 40 degrees per second (by the
// clock, not per frame), with a plain WebGL 1 shader: no library, no network. The number at
// the top left is the frame rate the desktop renders - not what reaches the client.
const SEG = 1000, RING = 100;                       // 2 * SEG * RING triangles
const cv = document.getElementById('c'), gl = cv.getContext('webgl', { antialias: true });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;font:20px sans-serif;padding:20px">WebGL 없음</p>'; throw 0; }
if (!gl.getExtension('OES_element_index_uint')) throw new Error('OES_element_index_uint');

const pos = [], nrm = [], idx = [];
const knot = (t) => { const p = 2, q = 3, r = 2 + Math.cos(q * t); return [r * Math.cos(p * t), r * Math.sin(p * t), -Math.sin(q * t)]; };
for (let i = 0; i <= SEG; i++) {
  const t = i / SEG * Math.PI * 2, a = knot(t), b = knot(t + 0.001);
  const T = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], tl = Math.hypot(...T); T.forEach((v, k) => T[k] = v / tl);
  let N = [T[1], -T[0], 0]; const nl = Math.hypot(...N) || 1; N = N.map(v => v / nl);
  const B = [T[1] * N[2] - T[2] * N[1], T[2] * N[0] - T[0] * N[2], T[0] * N[1] - T[1] * N[0]];
  for (let j = 0; j <= RING; j++) {
    const u = j / RING * Math.PI * 2, cx = Math.cos(u), sx = Math.sin(u);
    const n = [N[0] * cx + B[0] * sx, N[1] * cx + B[1] * sx, N[2] * cx + B[2] * sx];
    pos.push(a[0] + 0.45 * n[0], a[1] + 0.45 * n[1], a[2] + 0.45 * n[2]); nrm.push(...n);
  }
}
for (let i = 0; i < SEG; i++) for (let j = 0; j < RING; j++) {
  const a = i * (RING + 1) + j, b = a + RING + 1;
  idx.push(a, b, a + 1, b, b + 1, a + 1);
}

const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `
  attribute vec3 p; attribute vec3 n; uniform mat4 m; uniform float asp; varying vec3 vn; varying vec3 vp;
  void main() { vec4 w = m * vec4(p, 1.0); vn = mat3(m) * n; vp = w.xyz;
    gl_Position = vec4(w.x / asp, w.y, w.z * 0.1, w.z * 0.25 + 3.0); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `
  precision mediump float; varying vec3 vn; varying vec3 vp;
  void main() { vec3 n = normalize(vn), l = normalize(vec3(0.6, 0.8, -1.0));
    float d = max(dot(n, l), 0.0), s = pow(max(dot(reflect(-l, n), vec3(0.0, 0.0, -1.0)), 0.0), 32.0);
    vec3 c = mix(vec3(0.85, 0.45, 0.15), vec3(0.2, 0.5, 0.9), 0.5 + 0.5 * sin(vp.x * 2.0));
    gl_FragColor = vec4(c * (0.18 + 0.82 * d) + vec3(s), 1.0); }`));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = (data, attr) => { gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  const l = gl.getAttribLocation(prog, attr); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 0, 0); };
buf(pos, 'p'); buf(nrm, 'n');
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW);
const um = gl.getUniformLocation(prog, 'm'), ua = gl.getUniformLocation(prog, 'asp');
gl.enable(gl.DEPTH_TEST);

const fpsEl = document.getElementById('fps'); let frames = 0, since = performance.now();
function frame(t) {
  const w = cv.clientWidth * devicePixelRatio, h = cv.clientHeight * devicePixelRatio;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h); gl.clearColor(0.125, 0.14, 0.17, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const a = t / 1000 * 40 * Math.PI / 180, b = a * 0.6, ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), k = 0.28;
  // rotate about y by a, then about x by b, scaled by k (column-major)
  gl.uniformMatrix4fv(um, false, [k * ca, k * sa * sb, -k * sa * cb, 0,  0, k * cb, k * sb, 0,  k * sa, -k * ca * sb, k * ca * cb, 0,  0, 0, 0, 1]);
  gl.uniform1f(ua, w / h);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);
  frames++;
  if (t - since >= 1000) { fpsEl.textContent = (frames * 1000 / (t - since)).toFixed(0) + ' fps (desktop)'; frames = 0; since = t; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
