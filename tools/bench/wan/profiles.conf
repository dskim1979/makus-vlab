# MOAVI Desk protocol benchmark - WAN profiles for wan-profile.sh
#
# name     rate_mbit  rtt_ms  loss_pct  jitter_ms
#
# rate  : applied in each direction (symmetric link)
# rtt   : round trip; each direction gets rtt/2 of delay
# loss  : random loss applied in each direction (so a round trip loses about twice this)
# jitter: +/- per direction, normal distribution; 0 = none (jitter reorders packets in netem,
#         so the default profiles keep it at 0 to stay comparable between runs)
lan        1000       1       0         0
branch     20         30      0.5       0
home       10         50      1         0
bad        3          100     2         0
